# ADD THIS FILE VIA THE GITHUB WEB EDITOR — The GitHub App cannot
# push .github/workflows/*.yml files.
# Copy this file to .github/workflows/lark-pallet-delete-batch.yml
# in the repo (web editor: repo -> Add file -> Create new file ->
# paste -> Commit). One-off cleanup: delete every Pallet record
# row whose Batch# is DRAFTSHELF-2 (Yan confirmed it is not a
# real pallet — 30 rows, one per day 2026-10-13 .. 2026-11-11,
# in neither Excel file). Manual run only (workflow_dispatch);
# dry_run defaults to true so a run deletes nothing until the
# operator flips it off. The script itself refuses to delete
# unless the found count equals expected_count (default 30).
#
# Repo secrets needed (already set for the record sync / export):
#   LARK_APP_ID       Lark self-built app id
#   LARK_APP_SECRET   same app's secret
#   LARK_APP_TOKEN    Base app_token (QDo5bSOZraNgEhsRC7flOUMggPe)
# The job DELETES rows from the Pallet record table (the app has
# the Editor role on it). It only touches rows whose normalised
# Batch# equals batch exactly, and it verifies by re-reading
# afterwards; a re-run after a successful delete finds 0 rows
# and changes nothing.

name: Lark pallet delete batch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = report only, do not delete)"
        required: false
        default: "true"
        type: boolean
      batch:
        description: "Batch# whose rows to delete"
        required: false
        default: "DRAFTSHELF-2"
      expected_count:
        description: "Refuse to delete unless this many rows match"
        required: false
        default: "30"

concurrency:
  group: lark-pallet-delete-batch
  cancel-in-progress: false

jobs:
  delete-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Delete Batch# rows
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_TOKEN: ${{ secrets.LARK_APP_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 lark_pallet_delete_batch.py --batch "${{ inputs.batch }}" --expected-count "${{ inputs.expected_count }}" --dry-run
          else
            python3 lark_pallet_delete_batch.py --batch "${{ inputs.batch }}" --expected-count "${{ inputs.expected_count }}"
          fi
